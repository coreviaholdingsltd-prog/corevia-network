<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Cybersecurity &amp; Online Safety visual learning guide</title><desc id="desc">A simple visual teaching aid for Cybersecurity &amp; Online Safety in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><rect x="90" y="135" width="150" height="82" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="165" y="182" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">PAUSE</text><rect x="290" y="135" width="150" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365" y="182" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">VERIFY</text><rect x="490" y="135" width="150" height="82" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="565" y="182" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">PROTECT</text><rect x="690" y="135" width="150" height="82" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="765" y="182" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">REPORT</text><path d="M240 176 L290 176 M279.60769515458674 182 L290 176 L279.60769515458674 170" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 176 L490 176 M479.60769515458674 182 L490 176 L479.60769515458674 170" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 176 L690 176 M679.6076951545867 182 L690 176 L679.6076951545867 170" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="83" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#991b1b">WHEN A MESSAGE FEELS URGENT: STOP AND CHECK</text><text x="90" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0f172a">Do not share passwords or one-time codes.</text><text x="90" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#475569">Use an official address or app, not an unexpected link.</text></svg>