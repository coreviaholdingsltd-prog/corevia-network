<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Primary Science &amp; Environment visual learning guide</title><desc id="desc">A simple visual teaching aid for Primary Science &amp; Environment in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><rect x="58" y="135" width="130" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="123" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">QUESTION</text><rect x="235" y="135" width="130" height="76" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="300" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">PREDICT</text><rect x="412" y="135" width="130" height="76" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="477" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">TEST</text><rect x="589" y="135" width="130" height="76" rx="14" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/><text x="654" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">RECORD</text><rect x="766" y="135" width="130" height="76" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="831" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">EXPLAIN</text><path d="M188 173 L235 173 M224.60769515458674 179 L235 173 L224.60769515458674 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 173 L412 173 M401.60769515458674 179 L412 173 L401.60769515458674 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M542 173 L589 173 M578.6076951545867 179 L589 173 L578.6076951545867 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M719 173 L766 173 M755.6076951545867 179 L766 173 L755.6076951545867 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="82" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#475569">OBSERVE CAREFULLY AND KEEP A FAIR TEST</text><text x="85" y="271" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#0f172a">Record dates, units and what you actually observed.</text><text x="85" y="305" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#475569">A prediction is not a result; let the evidence decide.</text></svg>