<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Business Essentials visual learning guide</title><desc id="desc">A simple visual teaching aid for Business Essentials in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><path d="M110 290V88M110 290H770" stroke="#475569" stroke-width="3"/><path d="M110 100H770" stroke="#cbd5e1" stroke-dasharray="5 6"/><path d="M110 150H770" stroke="#cbd5e1" stroke-dasharray="5 6"/><path d="M110 200H770" stroke="#cbd5e1" stroke-dasharray="5 6"/><path d="M110 250H770" stroke="#cbd5e1" stroke-dasharray="5 6"/><rect x="180" y="130" width="94" height="160" rx="9" fill="#0284c7"/><text x="227" y="120" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">KES 900</text><text x="227" y="322" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">SELLING PRICE</text><rect x="360" y="183" width="94" height="107" rx="9" fill="#f59e0b"/><text x="407" y="173" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">KES 600</text><text x="407" y="322" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">DIRECT COST</text><rect x="540" y="236" width="94" height="54" rx="9" fill="#16a34a"/><text x="587" y="226" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">KES 300</text><text x="587" y="322" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">LEFT BEFORE OVERHEADS</text><text x="110" y="350" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#0f172a">KES 900 − KES 600 = KES 300 before overheads</text><text x="110" y="375" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#475569">Real profit also depends on other costs and sales volume.</text></svg>