<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Research Methods &amp; Critical Thinking visual learning guide</title><desc id="desc">A simple visual teaching aid for Research Methods &amp; Critical Thinking in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><rect x="70" y="120" width="125" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="132.5" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">QUESTION</text><rect x="235" y="120" width="125" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="297.5" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">SOURCES</text><rect x="400" y="120" width="125" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="462.5" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">METHOD</text><rect x="565" y="120" width="125" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="627.5" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">EVIDENCE</text><rect x="730" y="120" width="125" height="82" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="792.5" y="167" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">CONCLUSION</text><path d="M195 161 L235 161 M224.60769515458674 167 L235 161 L224.60769515458674 155" fill="none" stroke="#47