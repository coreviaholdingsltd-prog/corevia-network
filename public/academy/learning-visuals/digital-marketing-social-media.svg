<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Digital Marketing &amp; Social Media visual learning guide</title><desc id="desc">A simple visual teaching aid for Digital Marketing &amp; Social Media in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><text x="95" y="64" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#475569">A CAMPAIGN SHOULD MOVE TOWARD A MEASURABLE ACTION</text><path d="M100 105H760L690 165H170z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M170 178H690L625 238H235z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><path d="M235 251H625L570 311H290z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="430" y="143" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">REACH — people see the message</text><text x="430" y="216" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">INTEREST — enquiries or clicks</text><text x="430" y="289" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">ACTION — orders / sign-ups</text><text x="100" y="355" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#475569">Measure the result that matches the campaign goal.</text></svg>