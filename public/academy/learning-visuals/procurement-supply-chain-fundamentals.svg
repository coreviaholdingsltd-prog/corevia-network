<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Procurement &amp; Supply Chain Fundamentals visual learning guide</title><desc id="desc">A simple visual teaching aid for Procurement &amp; Supply Chain Fundamentals in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><rect x="70" y="135" width="125" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="132.5" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">NEED</text><rect x="235" y="135" width="125" height="76" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="297.5" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">SPECIFY</text><rect x="400" y="135" width="125" height="76" rx="14" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/><text x="462.5" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">COMPARE</text><rect x="565" y="135" width="125" height="76" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="627.5" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">APPROVE</text><rect x="730" y="135" width="125" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="792.5" y="179" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">INSPECT</text><path d="M195 173 L235 173 M224.60769515458674 179 L235 173 L224.60769515458674 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 173 L400 173 M389.60769515458674 179 L400 173 L389.60769515458674 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M525 173 L565 173 M554.6076951545867 179 L565 173 L554.6076951545867 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 173 L730 173 M719.6076951545867 179 L730 173 L719.6076951545867 167" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="85" y="86" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#475569">COMPARE LIKE WITH LIKE</text><text x="85" y="270" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0f172a">Total value = price + delivery + quality + warranty + risk</text><text x="85" y="305" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#475569">Keep the specification, quotation, approval and receipt records.</text></svg>