<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Basic Numeracy &amp; Mathematics visual learning guide</title><desc id="desc">A simple visual teaching aid for Basic Numeracy &amp; Mathematics in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><text x="90" y="75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#475569">BREAK THE NUMBER INTO PLACE VALUES</text><rect x="100" y="125" width="130" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="181" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f172a">3</text><text x="165" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#475569">THOUSANDS</text><rect x="275" y="125" width="130" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="340" y="181" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f172a">4</text><text x="340" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#475569">HUNDREDS</text><rect x="450" y="125" width="130" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="515" y="181" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f172a">8</text><text x="515" y="252" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#475569">TENS</text><rect x="625" y="125" width="130" height="10