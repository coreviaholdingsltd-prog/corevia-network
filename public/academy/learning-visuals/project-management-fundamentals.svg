<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Project Management Fundamentals visual learning guide</title><desc id="desc">A simple visual teaching aid for Project Management Fundamentals in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><text x="85" y="75" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#475569">PLAN THE WORK IN A REALISTIC ORDER</text><path d="M105 165H825" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><circle cx="130" cy="165" r="18" fill="#2563eb" stroke="#fff" stroke-width="3"/><text x="130" y="210" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">DEFINE</text><circle cx="300" cy="165" r="18" fill="#0284c7" stroke="#fff" stroke-width="3"/><text x="300" y="210" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">PLAN</text><circle cx="470" cy="165" r="18" fill="#d97706" stroke="#fff" stroke-width="3"/><text x="470" y="210" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">DO</text><circle cx="640" cy="165" r="18" fill="#16a34a" stroke="#fff" stroke-width="3"/><text x="640" y="210" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">CHECK</text><circle cx="805" cy="165" r="18" fill="#7c3aed" stroke="#fff" stroke-width="3"/><text x="805" y="210" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">CLOSE</text><text x="100" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0f172a">Tasks have owners, time estimates and dependencies.</text><text x="100" y="310" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#475569">A milestone is evidence of progress, not just a date.</text><rect x="115" y="340" width="210" height="48" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="220" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">RISK + OWNER</text><rect x="365" y="340" width="210" height="48" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="470" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">DEADLINE</text><rect x="615" y="340" width="210" height="48" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="720" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">ACCEPTANCE CHECK</text></svg>