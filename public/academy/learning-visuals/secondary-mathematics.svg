<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Secondary Mathematics visual learning guide</title><desc id="desc">A simple visual teaching aid for Secondary Mathematics in Corevia Rise Academy.</desc><rect width="960" height="390" rx="22" fill="#f8fafc"/><rect x="0" y="0" width="960" height="9" rx="4" fill="#0891b2"/><text x="44" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#0e7490">COREVIA RISE ACADEMY • VISUAL LEARNING</text><text x="85" y="72" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#475569">KEEP BOTH SIDES OF THE EQUATION BALANCED</text><rect x="90" y="120" width="200" height="85" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="168.5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">3x + 5 = 20</text><path d="M290 162 L355 162 M344.60769515458674 168 L355 162 L344.60769515458674 156" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="120" width="200" height="85" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="455" y="168.5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#0f172a">3x = 15</text><path d="M555 162 L620 162 M609.6076951545867 168 L620 162 L609.6076951545867 156" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="120" width="200" height="85" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="720" y="168.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0f172a">x = 5</text><text x="100" y="255" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#334155">Step 1: subtract 5 from BOTH sides.</text><text x="100" y="285" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#334155">Step 2: divide BOTH sides by 3.</text><text x="100" y="330" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#15803d">Check: 3(5) + 5 = 20 ✓</text></svg>