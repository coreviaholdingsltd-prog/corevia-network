nt-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">SPEED = 2 m/s</text><text x="90" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#0f172a">Keep units consistent and check the result is plausible.</text></svg>