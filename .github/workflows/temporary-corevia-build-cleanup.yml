name: Temporary Corevia dependency and lint cleanup

on:
  pull_request:
    branches:
      - fix/wallet-page-effects-20261104

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Apply reviewed source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count}, found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new))

          p = "app/academy/page.tsx"
          rep(p, 'import { usePathname } from "next/navigation";', 'import { usePathname, useRouter } from "next/navigation";')
          rep(p, '  const pathname = usePathname();\n', '  const pathname = usePathname();\n  const router = useRouter();\n')
          rep(p, '  useEffect(() => {\n    if (routeCourseId) {\n      setExpandedCourse(routeCourseId);\n    }\n  }, [routeCourseId]);\n\n', '')
          rep(p, '  const verifyAcademyPayment = useCallback(async (reference: string) => {\n    setPendingPaymentReference(reference);\n    setVerifyingPayment(true);\n    setNotice("Confirming your Academy course payment...");\n    setError("");\n\n    try {\n      const response = await fetch("/api/academy/payments/verify", {', '  const verifyAcademyPayment = useCallback(async (reference: string) => {\n    try {\n      const response = await fetch("/api/academy/payments/verify", {')
          rep(p, '      const result = await response.json();\n\n      if (!response.ok) {\n        throw new Error(result.error || "Course payment verification failed.");', '      const result = await response.json();\n      setPendingPaymentReference(reference);\n\n      if (!response.ok) {\n        throw new Error(result.error || "Course payment verification failed.");')
          rep(p, 'window.location.href = result.authorization_url;', 'window.location.assign(result.authorization_url);')
          old_nav = "window.location.href = " + chr(96) + "/academy/study/" + chr(36) + "{encodeURIComponent(course.id)}" + chr(96) + ";"
          rep(p, old_nav, 'router.push("/academy/study/" + encodeURIComponent(course.id));', 2)
          rep(p, '              onClick={() => void verifyAcademyPayment(pendingPaymentReference)}', '              onClick={() => {\n                setVerifyingPayment(true);\n                void verifyAcademyPayment(pendingPaymentReference);\n              }}')
          old = '''  useEffect(() => {
            const reference = new URLSearchParams(window.location.search).get("payment");
            if (reference) {
              void verifyAcademyPayment(reference);
            } else {
              void loadCourses();
            }
          }, [loadCourses, verifyAcademyPayment]);
          '''.replace("            ", "    ")
          new = '''  useEffect(() => {
            let active = true;
            const reference = new URLSearchParams(window.location.search).get("payment");
            const request = reference
              ? fetch("/api/academy/payments/verify", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ reference }),
                  cache: "no-store",
                })
              : fetch("/api/academy/courses", { cache: "no-store" });

            request
              .then(async (response) => {
                const result = await response.json();
                if (!reference && response.status === 401) return { kind: "unauthorized" as const, result };
                if (!response.ok) throw new Error(result.error || (reference ? "Course payment verification failed." : "Unable to load Academy courses."));
                return { kind: reference ? "payment" as const : "courses" as const, result };
              })
              .then(async ({ kind, result }) => {
                if (!active) return;
                if (kind === "unauthorized") {
                  setAuthRequired(true);
                  setCourses([]);
                  return;
                }
                if (kind === "payment") {
                  setNotice(result.message || "Payment confirmed. Your course is now available.");
                  setError("");
                  setPendingPaymentReference("");
                  window.history.replaceState({}, "", "/academy");
                  await loadCourses();
                  return;
                }
                setAuthRequired(false);
                setMemberName(result.user?.name || "Corevia member");
                setCourses(result.courses || []);
              })
              .catch((issue) => {
                if (!active) return;
                setError(
                  issue instanceof Error
                    ? reference
                      ? issue.message + " Your payment reference has been kept so you can retry verification. Do not pay again until the status is confirmed."
                      : issue.message
                    : "Unable to load Academy information.",
                );
                if (reference) {
                  setNotice("");
                  setPendingPaymentReference(reference);
                }
              })
              .finally(() => {
                if (active) {
                  setLoading(false);
                  setVerifyingPayment(false);
                }
              });

            return () => {
              active = false;
            };
          }, [loadCourses]);
          '''.replace("            ", "    ")
          rep(p, old, new)

          p = "app/api/auth/register/route.ts"
          rep(p, '    let referrerId: string | undefined;\n', '')
          rep(p, '    referrerId = referrer.id;\n', '    const referrerId = referrer.id;\n')

          p = "app/api/spin/route.ts"
          rep(p, 'import { prisma } from "@/lib/prisma";', 'import type { Prisma } from "@/app/generated/prisma/client";\nimport { prisma } from "@/lib/prisma";')
          rep(p, 'async function getAvailablePool(tx: any) {', 'async function getAvailablePool(tx: Prisma.TransactionClient) {')
          rep(p, 'async function getOrCreateEvent(tx: any, scheduledFor: Date) {', 'async function getOrCreateEvent(tx: Prisma.TransactionClient, scheduledFor: Date) {')

          p = "app/dashboard/page.tsx"
          rep(p, 'import { useCallback, useEffect, useState } from "react";', 'import Link from "next/link";\nimport { useRouter } from "next/navigation";\nimport { useCallback, useEffect, useState } from "react";')
          rep(p, 'export default function Dashboard() {\n', 'export default function Dashboard() {\n  const router = useRouter();\n')
          rep(p, '    setLoading(true);\n    setError("");\n    setReferralError("");\n\n    try {\n      const response = await fetch("/api/auth/me", {\n        cache: "no-store",\n      });\n', '    try {\n      const response = await fetch("/api/auth/me", {\n        cache: "no-store",\n      });\n      setError("");\n      setReferralError("");\n')
          rep(p, 'window.location.assign("/login");', 'router.replace("/login");')
          for href in ["/missions", "/gigs", "/gigs/manage", "/portfolio"]:
              rep(p, '<a\n            href="' + href + '"', '<Link\n            href="' + href + '"')
          for label in ["Skill Missions", "Rise Gigs", "My Gigs & Applications", "My Portfolio"]:
              rep(p, ">" + label + "</a>", ">" + label + "</Link>")
          old = '''  useEffect(() => {
            void loadDashboard();
          }, [loadDashboard]);
          '''.replace("            ", "    ")
          new = '''  useEffect(() => {
            let active = true;
            fetch("/api/auth/me", { cache: "no-store" })
              .then(async (response) => {
                if (!response.ok) throw new Error("Please sign in to access your dashboard.");
                const result = await response.json();
                const account = result.user as User | undefined;
                if (!account?.id || !account?.referralCode) throw new Error("Your account information could not be loaded. Please sign in again.");
                return account;
              })
              .then(async (account) => {
                if (!active) return;
                setError("");
                setReferralError("");
                setUser(account);
                try {
                  const response = await fetch("/api/my-referrals", { cache: "no-store" });
                  const result = await response.json();
                  if (!active) return;
                  if (!response.ok || result.status !== true || !Array.isArray(result.clients)) {
                    setReferralError(result.error || "Unable to load your referrals. Please try again.");
                    return;
                  }
                  setReferrals({
                    status: true,
                    total: Number(result.total) || 0,
                    active: Number(result.active) || 0,
                    pending: Number(result.pending) || 0,
                    clients: result.clients.map((client: Referral) => ({ ...client, rewardEarned: Number(client.rewardEarned) || 0 })),
                  });
                } catch {
                  if (active) setReferralError("Unable to load referral information. Please try again.");
                }
              })
              .catch((issue) => {
                if (active) setError(issue instanceof Error ? issue.message : "Unable to connect to Corevia Rise. Please try again.");
              })
              .finally(() => {
                if (active) setLoading(false);
              });
            return () => { active = false; };
          }, []);
          '''.replace("            ", "    ")
          rep(p, old, new)

          p = "app/gigs/gigs-client.tsx"
          rep(p, 'import Link from "next/link";\n', 'import Link from "next/link";\nimport { useRouter } from "next/navigation";\n')
          rep(p, 'export default function GigsClient() {\n', 'export default function GigsClient() {\n  const router = useRouter();\n')
          rep(p, '    setLoading(true);\n    setError("");\n    try {\n', '    try {\n')
          rep(p, '      const data = await response.json();\n      if (!response.ok || data.status !== true || !Array.isArray(data.gigs))', '      const data = await response.json();\n      setError("");\n      if (!response.ok || data.status !== true || !Array.isArray(data.gigs))')
          rep(p, 'window.location.assign("/login")', 'router.push("/login")', 2)
          rep(p, '  useEffect(() => { void loadGigs(); }, [loadGigs]);', '''  useEffect(() => {
            let active = true;
            const params = new URLSearchParams();
            if (query.trim()) params.set("q", query.trim());
            if (category !== "all") params.set("category", category);
            if (workMode !== "all") params.set("workMode", workMode);
            fetch("/api/gigs?" + params.toString(), { cache: "no-store" })
              .then(async (response) => {
                const data = await response.json();
                if (!response.ok || data.status !== true || !Array.isArray(data.gigs)) throw new Error(data.error || "Unable to load gigs.");
                return data.gigs as Gig[];
              })
              .then((loadedGigs) => {
                if (!active) return;
                setError("");
                setGigs(loadedGigs);
              })
              .catch((err) => {
                if (active) setError(err instanceof Error ? err.message : "Unable to load gigs.");
              })
              .finally(() => {
                if (active) setLoading(false);
              });
            return () => { active = false; };
          }, [query, category, workMode]);''')

          p = "app/gigs/manage/manage-gigs-client.tsx"
          rep(p, '    setLoading(true); setError(""); setSignedOut(false);\n    try {\n      const response = await fetch("/api/gigs/manage", { cache: "no-store" });\n      const result = await response.json();\n', '    try {\n      const response = await fetch("/api/gigs/manage", { cache: "no-store" });\n      const result = await response.json();\n      setError("");\n      setSignedOut(false);\n')
          rep(p, '  useEffect(() => { void load(); }, [load]);', '''  useEffect(() => {
            let active = true;
            fetch("/api/gigs/manage", { cache: "no-store" })
              .then(async (response) => {
                const result = await response.json();
                if (response.status === 401) return { signedOut: true, data: null as PageData | null };
                if (!response.ok || result.status !== true) throw new Error(result.error || "Unable to load Gigs management.");
                return { signedOut: false, data: result as PageData };
              })
              .then((result) => {
                if (!active) return;
                setError("");
                setSignedOut(result.signedOut);
                setData(result.data);
              })
              .catch((err) => {
                if (active) setError(err instanceof Error ? err.message : "Unable to load Gigs management.");
              })
              .finally(() => {
                if (active) setLoading(false);
              });
            return () => { active = false; };
          }, []);''')

          p = "app/portfolio/portfolio-client.tsx"
          rep(p, '  const [profile, setProfile] = useState<Profile | null>(null);\n', '')
          rep(p, '    setLoading(true); setError(""); setSignedOut(false);\n    try {\n      const response = await fetch("/api/portfolio", { cache: "no-store" });\n      const result = await response.json();\n', '    try {\n      const response = await fetch("/api/portfolio", { cache: "no-store" });\n      const result = await response.json();\n      setError("");\n      setSignedOut(false);\n')
          rep(p, '      setProfile(current);\n', '')
          rep(p, '      setProfile(result.profile as Profile); setItems(result.profile.items || items); setPublicUrl(result.publicUrl || "");', '      setItems(result.profile.items || items); setPublicUrl(result.publicUrl || "");')
          rep(p, '      setProfile((current) => current ? { ...current, items: [result.item as PortfolioItem, ...current.items] } : current);\n', '')
          rep(p, '      setProfile((current) => current ? { ...current, items: current.items.filter((item) => item.id !== itemId) } : current);\n', '')
          rep(p, '  useEffect(() => { void load(); }, [load]);', '''  useEffect(() => {
            let active = true;
            fetch("/api/portfolio", { cache: "no-store" })
              .then(async (response) => {
                const result = await response.json();
                if (response.status === 401) return { signedOut: true, profile: null as Profile | null, publicUrl: "" };
                if (!response.ok || result.status !== true) throw new Error(result.error || "Unable to load your portfolio.");
                return { signedOut: false, profile: result.profile as Profile | null, publicUrl: result.publicUrl || "" };
              })
              .then((result) => {
                if (!active) return;
                setError("");
                setSignedOut(result.signedOut);
                setPublicUrl(result.publicUrl);
                const current = result.profile;
                setItems(current?.items || []);
                if (current) {
                  setForm({
                    headline: current.headline || "",
                    bio: current.bio || "",
                    location: current.location || "",
                    skills: current.skills || "",
                    websiteUrl: current.websiteUrl || "",
                    linkedinUrl: current.linkedinUrl || "",
                    githubUrl: current.githubUrl || "",
                    isPublic: current.isPublic,
                  });
                } else setForm(emptyProfile);
              })
              .catch((issue) => {
                if (active) setError(issue instanceof Error ? issue.message : "Unable to load your portfolio.");
              })
              .finally(() => {
                if (active) setLoading(false);
              });
            return () => { active = false; };
          }, []);''')

          p = "app/missions/page.tsx"
          rep(p, 'import { useEffect, useMemo, useState } from "react";', 'import { useMemo, useState, useSyncExternalStore } from "react";')
          rep(p, 'const STORAGE_KEY = "corevia-rise-skill-missions-v1";\n', '''const STORAGE_KEY = "corevia-rise-skill-missions-v1";
          const MISSIONS_STORAGE_EVENT = "corevia-rise-missions-updated";
          function subscribeToMissions(callback: () => void) {
            window.addEventListener("storage", callback);
            window.addEventListener(MISSIONS_STORAGE_EVENT, callback);
            return () => {
              window.removeEventListener("storage", callback);
              window.removeEventListener(MISSIONS_STORAGE_EVENT, callback);
            };
          }
          function getMissionsSnapshot() {
            try { return window.localStorage.getItem(STORAGE_KEY) ?? "[]"; }
            catch { return "[]"; }
          }
          function getServerMissionsSnapshot() { return "[]"; }
          function parseCompletedMissions(raw: string) {
            try {
              const parsed: unknown = JSON.parse(raw);
              return Array.isArray(parsed)
                ? parsed.filter((id): id is string => typeof id === "string" && missions.some((mission) => mission.id === id))
                : [];
            } catch { return []; }
          }
          ''')
          old = '''  const [completed, setCompleted] = useState<string[]>([]);
            const [loaded, setLoaded] = useState(false);
            const [message, setMessage] = useState("");
            useEffect(() => {
              try {
                const raw = window.localStorage.getItem(STORAGE_KEY);
                const parsed: unknown = raw ? JSON.parse(raw) : [];
                if (Array.isArray(parsed)) {
                  setCompleted(parsed.filter((id): id is string => typeof id === "string" && missions.some((mission) => mission.id === id)));
                }
              } catch { setCompleted([]); }
              setLoaded(true);
            }, []);
            useEffect(() => {
              if (!loaded) return;
              try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(completed)); }
              catch { setMessage("Progress could not be saved on this browser. You can still download your portfolio."); }
            }, [completed, loaded]);
            const completedCount = completed.length;
            const progress = Math.round((completedCount / missions.length) * 100);
            const completedMissions = useMemo(() => missions.filter((mission) => completed.includes(mission.id)), [completed]);
            function toggleMission(id: string) {
              setMessage("");
              setCompleted((current) => current.includes(id) ? current.filter((item) => item !== id) : [...current, id]);
            }
          '''
          old = old.replace("            ", "    ")
          new = '''  const storedCompleted = useSyncExternalStore(subscribeToMissions, getMissionsSnapshot, getServerMissionsSnapshot);
          const completed = useMemo(() => parseCompletedMissions(storedCompleted), [storedCompleted]);
          const [message, setMessage] = useState("");
          const completedCount = completed.length;
          const progress = Math.round((completedCount / missions.length) * 100);
          function toggleMission(id: string) {
            setMessage("");
            const next = completed.includes(id) ? completed.filter((item) => item !== id) : [...completed, id];
            try {
              window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
              window.dispatchEvent(new Event(MISSIONS_STORAGE_EVENT));
            } catch {
              setMessage("Progress could not be saved on this browser. You can still download your portfolio.");
            }
          }
          '''.replace("            ", "    ")
          rep(p, old, new)

          p = "app/register/page.tsx"
          rep(p, 'import { FormEvent, useEffect, useState } from "react";', 'import type { FormEvent } from "react";\nimport { useState, useSyncExternalStore } from "react";')
          rep(p, 'export default function Register() {\n', '''function subscribeToLocation(callback: () => void) {
            window.addEventListener("popstate", callback);
            return () => window.removeEventListener("popstate", callback);
          }
          function getReferralCodeFromLocation() {
            return new URLSearchParams(window.location.search).get("ref")?.toUpperCase() ?? "";
          }
          function getServerReferralCode() { return ""; }
          export default function Register() {
            const referralCodeFromUrl = useSyncExternalStore(subscribeToLocation, getReferralCodeFromLocation, getServerReferralCode);
          ''')
          rep(p, '  const [referralCode, setReferralCode] = useState("");\n\n  useEffect(() => {\n    const ref = new URLSearchParams(window.location.search).get("ref");\n    if (ref) setReferralCode(ref.toUpperCase());\n  }, []);\n', '  const [referralCodeOverride, setReferralCodeOverride] = useState<string | null>(null);\n  const referralCode = referralCodeOverride ?? referralCodeFromUrl;\n')
          rep(p, '                    setReferralCode(event.target.value.toUpperCase())', '                    setReferralCodeOverride(event.target.value.toUpperCase())')

          rep("app/opportunities/page.tsx", "We won't invent vacancies", "We won&apos;t invent vacancies")
          rep("app/page.tsx", "platform's opportunity features", "platform&apos;s opportunity features")
          rep("app/opportunities/page.tsx", '''const filters = [
            { label: "All pathways", value: "all" },
            { label: "Jobs in Kenya", value: "Jobs in Kenya" },
            { label: "Digital work", value: "Digital work" },
            { label: "Youth programmes", value: "Youth programmes" },
            { label: "Business support", value: "Business support" },
            { label: "Career guidance", value: "Career guidance" },
          ];

          ''', '')
          print("Applied Corevia source cleanup.")
          PY

      - name: Refresh lockfile and run clean checks
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
          PRISMA_DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
        run: |
          npm install
          npm ci
          npm audit
          npm run lint
          npm run build

      - name: Commit validated files and remove temporary workflow
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm .github/workflows/temporary-corevia-build-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden dependencies and clear production lint"
          git push origin "HEAD:$HEAD_REF"
