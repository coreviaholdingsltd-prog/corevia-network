name: Corevia Academy academic quality gate

on:
  pull_request:
    paths:
      - "lib/academy-catalog.ts"
      - "lib/academy-pathways.ts"
      - "prisma/schema.prisma"
      - "scripts/academy-quality-audit.mjs"
      - ".github/workflows/academy-quality-audit.yml"
  push:
    branches:
      - main
      - "feat/academy-*"
      - "audit/academy-*"

permissions:
  contents: read

jobs:
  academic-quality-audit:
    name: Academy source audit and release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run structural and academic release audit
        run: npm run academy:audit:strict
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corevia-academy-quality-audit
          path: |
            artifacts/academy-quality-audit.json
            artifacts/academy-quality-audit.md
          if-no-files-found: warn
