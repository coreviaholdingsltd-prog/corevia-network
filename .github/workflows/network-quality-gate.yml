name: Corevia Network quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: corevia-network-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Database, lint, Academy audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Isolated ephemeral CI database. Never points at Neon or Production.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/corevia_ci?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corevia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corevia_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply every migration to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint complete application
        run: npm run lint

      - name: Audit Academy source structure
        run: npm run academy:audit

      - name: Build production application
        run: npm run build
