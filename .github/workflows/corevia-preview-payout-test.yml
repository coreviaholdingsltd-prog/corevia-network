name: Corevia Preview payout lifecycle test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: corevia-preview-payout-lifecycle-test
  cancel-in-progress: false

jobs:
  reconcile-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 3
    steps:
      - name: Verify Preview credentials are configured
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ vars.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$PREVIEW_CRON_SECRET" || { echo "::error::PREVIEW_CRON_SECRET is missing"; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing from GitHub Preview environment variables"; exit 1; }

      - name: Reconcile Preview Paystack sandbox transfers
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ vars.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $PREVIEW_CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "https://corevia-network-ns04z612a-okerimaxwell8-2828.vercel.app/api/cron/reconcile-paystack-payouts"

      - name: Process at most one Preview sandbox withdrawal
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ vars.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $PREVIEW_CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "https://corevia-network-ns04z612a-okerimaxwell8-2828.vercel.app/api/cron/process-paystack-withdrawals"
