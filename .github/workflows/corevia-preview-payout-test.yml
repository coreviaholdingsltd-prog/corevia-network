name: Corevia Preview payout lifecycle test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corevia-preview-payout-lifecycle-test
  cancel-in-progress: false

jobs:
  reconcile-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Preview scheduler secret is configured
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
        run: |
          if [ -z "$PREVIEW_CRON_SECRET" ]; then
            echo "::error::Add PREVIEW_CRON_SECRET in GitHub Actions repository secrets. It must match the Vercel Preview CRON_SECRET."
            exit 1
          fi

      - name: Reconcile Preview Paystack sandbox transfers
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $PREVIEW_CRON_SECRET" \
            "https://corevia-network-ns04z612a-okerimaxwell8-2828.vercel.app/api/cron/reconcile-paystack-payouts"

      - name: Process at most one Preview sandbox withdrawal
        env:
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $PREVIEW_CRON_SECRET" \
            "https://corevia-network-ns04z612a-okerimaxwell8-2828.vercel.app/api/cron/process-paystack-withdrawals"
